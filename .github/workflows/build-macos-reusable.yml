name: "Reusable macOS Build"

on:
  workflow_call:
    inputs:
      create-setup:
        description: 'Whether to create artifact for download'
        required: false
        type: boolean
        default: false
      build-type:
        description: 'Build type (Debug or Release)'
        required: false
        type: string
        default: 'Release'
      runner-type:
        description: 'Runner label (macos-15 for universal build, or self-hosted labels)'
        required: false
        type: string
        default: 'macos-15'

jobs:
  buildMacOS:
    runs-on: ${{ inputs.runner-type }}
    env:
      SCCACHE_DIR: ${{github.workspace}}/.sccache
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install and configure LLVM Clang (GitHub-hosted)
      if: ${{ !startsWith(inputs.runner-type, 'self-hosted') }}
      run: |
        brew install llvm
        LLVM_BIN="$(brew --prefix llvm)/bin"
        echo "LLVM_BIN=$LLVM_BIN" >> $GITHUB_ENV
        # Use libc++ so <print> (C++23) and <expected> are available
        echo "STDLIB_FLAG=-stdlib=libc++" >> $GITHUB_ENV

    - name: Configure LLVM Clang (self-hosted macOS)
      if: ${{ startsWith(inputs.runner-type, 'self-hosted') }}
      run: |
        # Self-hosted macOS runner should already have a C++23-capable clang.
        # Ensure libc++ is used for <print> support.
        echo "STDLIB_FLAG=-stdlib=libc++" >> $GITHUB_ENV

    - name: Setup CMake 3.30+ and Ninja
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: '~3.30.0'
        ninjaVersion: 'latest'

    - run: mkdir ${{github.workspace}}/build

    - name: Verify Clang
      run: |
        clang++ --version
        cmake --version

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.9

    # Note: FetchContent is intentionally NOT cached. The glaze repo tracks
    # origin/main, and stale cache can cause build failures due to
    # partial/mismatched source files.

    - name: Configure CMake (GitHub runner - universal binary)
      if: ${{ !startsWith(inputs.runner-type, 'self-hosted') }}
      run: |
        cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{inputs.build-type}} -GNinja \
          -DCMAKE_C_COMPILER=${LLVM_BIN}/clang \
          -DCMAKE_CXX_COMPILER=${LLVM_BIN}/clang++ \
          -DCMAKE_CXX_FLAGS="${STDLIB_FLAG}" \
          -DCMAKE_EXE_LINKER_FLAGS="${STDLIB_FLAG}" \
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

    - name: Configure CMake (self-hosted - native architecture)
      if: ${{ startsWith(inputs.runner-type, 'self-hosted') }}
      run: |
        cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{inputs.build-type}} -GNinja \
          -DCMAKE_CXX_FLAGS="${STDLIB_FLAG}" \
          -DCMAKE_EXE_LINKER_FLAGS="${STDLIB_FLAG}"

    - name: Build kwxgen
      run: |
        cmake --build ${{github.workspace}}/build -j$(sysctl -n hw.ncpu) --config ${{inputs.build-type}} --target kwxgen

    - name: Create Artifact
      if: ${{ inputs.create-setup }}
      uses: actions/upload-artifact@v4
      with:
        name: macOS-universal
        path: |
          build/kwxgen
