name: "Reusable Unix Build"

on:
  workflow_call:
    inputs:
      create-setup:
        description: 'Whether to create artifact for download'
        required: false
        type: boolean
        default: false
      build-type:
        description: 'Build type (Debug or Release)'
        required: false
        type: string
        default: 'Release'
      runner-type:
        description: 'Runner type (self-hosted or github-hosted)'
        required: false
        type: string
        default: 'github-hosted'

jobs:
  buildUnix:
    runs-on: ${{ inputs.runner-type == 'self-hosted' && fromJSON('["self-hosted", "Linux", "X64"]') || 'ubuntu-latest' }}
    env:
      SCCACHE_DIR: ${{github.workspace}}/.sccache
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install unzip (required by get-cmake)
      if: ${{ inputs.runner-type != 'self-hosted' }}
      run: sudo apt-get update && sudo apt-get install -y unzip

    - name: Setup CMake 3.30+ and Ninja
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: '~3.30.0'
        ninjaVersion: 'latest'

    - run: mkdir ${{github.workspace}}/build

    - name: Install libc++ and set stdlib flag (self-hosted)
      if: ${{ inputs.runner-type == 'self-hosted' }}
      run: |
        # Self-hosted runner has clang-22 pre-installed. Ensure libc++ is
        # available so <print> (C++23) can be found.
        sudo apt-get install -y libc++-22-dev libc++abi-22-dev
        echo "STDLIB_FLAG=-stdlib=libc++" >> $GITHUB_ENV

    - name: Install LLVM Clang 21 (GitHub-hosted)
      if: ${{ inputs.runner-type != 'self-hosted' }}
      run: |
        sudo apt-get update
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 21 all
        # Create unversioned symlinks so CMake uses the same compiler name
        # on both GitHub-hosted (clang-21) and self-hosted (clang v22)
        # Use ln -sf (not update-alternatives) because the ubuntu-latest runner
        # ships clang-18 pre-installed and /usr/bin/clang++ may be a regular
        # file, not managed by alternatives — --install doesn't force the switch.
        sudo ln -sf /usr/bin/clang-21 /usr/bin/clang
        sudo ln -sf /usr/bin/clang++-21 /usr/bin/clang++
        # Use libc++ (installed above via 'all') so std::expected is always
        # available regardless of the system libstdc++ version
        echo "STDLIB_FLAG=-stdlib=libc++" >> $GITHUB_ENV
        # Also set CC/CXX env vars as a belt-and-suspenders measure so CMake
        # can fall back to versioned names even if symlinks are broken.
        echo "CC=clang-21" >> $GITHUB_ENV
        echo "CXX=clang++-21" >> $GITHUB_ENV

    - name: Verify clang
      run: clang++ --version

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.9

    # Note: FetchContent is intentionally NOT cached. The glaze repo tracks
    # origin/main, and stale cache can cause build failures due to
    # partial/mismatched source files.

    - name: Configure CMake
      run: |
        EXTRA=""
        if [ -n "${STDLIB_FLAG}" ]; then
          EXTRA="-DCMAKE_CXX_FLAGS=${STDLIB_FLAG} -DCMAKE_EXE_LINKER_FLAGS=${STDLIB_FLAG}"
        fi
        cmake -B ${{github.workspace}}/build \
          -DCMAKE_BUILD_TYPE=${{inputs.build-type}} \
          -GNinja \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          ${EXTRA}

    - name: Build kwxgen
      run: cmake --build ${{github.workspace}}/build -j$(nproc) --config ${{inputs.build-type}} --target kwxgen

    - name: Create Artifact
      if: ${{ inputs.create-setup }}
      uses: actions/upload-artifact@v4
      with:
        name: LinuxExecutable
        path: |
          build/kwxgen
